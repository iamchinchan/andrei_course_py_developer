<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">
  <meta content="width=device-width,initial-scale=1" name="viewport">
  <meta content="description" name="description">
  <meta name="google" content="notranslate" />
  
  <!-- Disable tap highlight on IE -->
  <meta name="msapplication-tap-highlight" content="no">
  
  <link rel="apple-touch-icon" sizes="180x180" href="{{url_for('static',filename='assets/apple-icon-180x180.png')}}">
  <link href="{{url_for('static',filename='assets/favicon.ico')}}" rel="icon">
  
  <title>Thank You - Jatin's Portfolio</title>
  
  <style>
    /* CSS Reset and Base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f0f0f;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }
    
    /* Animated Background */
    .background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: -1;
    }
    
    .background::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at center, #1a2a63, #b21f1f, #1a2a63);
      background-size: 200% 200%;
      animation: gradientShift 15s ease infinite;
      z-index: -2;
    }
    
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    .shape {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      animation: float 20s ease-in-out infinite;
    }
    
    .shape-1 {
      width: 300px;
      height: 300px;
      top: 10%;
      left: 10%;
      animation-delay: 0s;
      animation-duration: 18s;
    }
    
    .shape-2 {
      width: 200px;
      height: 200px;
      top: 60%;
      right: 15%;
      animation-delay: 5s;
      animation-duration: 22s;
    }
    
    .shape-3 {
      width: 400px;
      height: 400px;
      bottom: 10%;
      left: 20%;
      animation-delay: 8s;
      animation-duration: 25s;
    }
    
    .shape-4 {
      width: 150px;
      height: 150px;
      top: 30%;
      right: 10%;
      animation-delay: 12s;
      animation-duration: 16s;
    }
    
    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-30px) rotate(180deg);
      }
    }
    
    /* Main Content */
    .container {
      position: relative;
      z-index: 10;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
    }
    
    .content {
      background: rgba(15, 15, 15, 0.7);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 60px 40px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      transform: translateY(30px);
      opacity: 0;
      animation: fadeInUp 1.2s ease-out 0.5s forwards;
    }
    
    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .icon {
      width: 100px;
      height: 100px;
      margin: 0 auto 30px;
      position: relative;
    }
    
    .checkmark-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid #4ade80;
      position: relative;
      animation: checkmarkCircle 1.5s ease-in-out;
    }
    
    @keyframes checkmarkCircle {
      0% {
        stroke-dashoffset: 200;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }
    
    .checkmark {
      width: 100px;
      height: 100px;
      position: absolute;
      top: 0;
      left: 0;
    }
    
    .checkmark path {
      stroke: #4ade80;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: checkmarkDraw 0.5s ease-in-out 0.8s forwards;
    }
    
    @keyframes checkmarkDraw {
      0% {
        stroke-dashoffset: 100;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }
    
    h1 {
      font-size: 3.5rem;
      font-weight: 800;
      margin-bottom: 20px;
      background: linear-gradient(to right, #4ade80, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textShine 3s ease-in-out infinite;
    }
    
    @keyframes textShine {
      0% {
        background-position: 0% 50%;
      }
      100% {
        background-position: 100% 50%;
      }
    }
    
    .subtitle {
      font-size: 1.25rem;
      color: #9ca3af;
      margin-bottom: 40px;
      line-height: 1.6;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }
    
    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 50px;
      text-decoration: none;
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
      overflow: hidden;
      border: none;
      cursor: pointer;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #4ade80, #22c55e);
      color: white;
      box-shadow: 0 10px 25px rgba(74, 222, 128, 0.3);
    }
    
    .btn-primary:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 35px rgba(74, 222, 128, 0.4);
      background: linear-gradient(135deg, #22c55e, #16a34a);
    }
    
    .btn-primary:active {
      transform: translateY(-2px);
    }
    
    .btn-outline {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }
    
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2);
    }
    
    .btn-outline:active {
      transform: translateY(-2px);
    }
    
    .btn-icon {
      width: 20px;
      height: 20px;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .container {
        padding: 15px;
      }
      
      .content {
        padding: 40px 25px;
      }
      
      h1 {
        font-size: 2.5rem;
      }
      
      .subtitle {
        font-size: 1.1rem;
      }
      
      .btn {
        padding: 12px 24px;
        font-size: 0.9rem;
      }
    }
    
    @media (max-width: 480px) {
      h1 {
        font-size: 2rem;
      }
      
      .content {
        padding: 30px 20px;
      }
    }
    
    /* Floating particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    
    .particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      animation: floatParticle linear infinite;
    }
    
    @keyframes floatParticle {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100px) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <!-- Animated Background Shapes -->
  <div class="background">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>
  </div>
  
  <!-- Floating Particles -->
  <div class="particles">
    <!-- Particles will be generated by JS for better control -->
  </div>
  
  <!-- Main Content -->
  <div class="container">
    <div class="content">
      <div class="icon">
        <svg class="checkmark-circle" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="45" fill="none" stroke="#4ade80" stroke-width="8"/>
        </svg>
        <svg class="checkmark" viewBox="0 0 100 100">
          <path d="M30,50 L40,60 L70,30" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Message Sent!</h1>
      <p class="subtitle">
        Thank you for reaching out! Your message has been successfully delivered and I'll get back to you shortly.
      </p>
      <div class="buttons">
        <a href="{{ url_for('render_page', page_name='index.html') }}" class="btn btn-primary">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 12L11 18M5 12L11 6M5 12H19" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Back to Home
        </a>
        <a href="{{ url_for('render_page', page_name='works.html') }}" class="btn btn-outline">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 4v16m8-8H4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          View Works
        </a>
      </div>
    </div>
  </div>
  
  <!-- Existing Scripts -->
  <script>
    document.addEventListener("DOMContentLoaded", function (event) {
      navActivePage();
    });
  </script>
  
  <!-- Generate Particles -->
  <script>
    // Generate floating particles
    function createParticles() {
      const particlesContainer = document.querySelector('.particles');
      const particleCount = 30;
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        
        // Random size
        const size = Math.random() * 6 + 2; // 2-8px
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        
        // Random starting position
        particle.style.left = `${Math.random() * 100}%`;
        
        // Random animation duration and delay
        const duration = Math.random() * 10 + 5; // 5-15s
        const delay = Math.random() * 5; // 0-5s delay
        particle.style.animationDuration = `${duration}s`;
        particle.style.animationDelay = `${delay}s`;
        
        particlesContainer.appendChild(particle);
      }
    }
    
    // Create particles on load
    createParticles();
  </script>
  
  <script type="text/javascript" src="{{url_for('static', filename='main.70a66962.js')}}"></script>
</body>
</html>
